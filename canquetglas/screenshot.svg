<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#0a0a0a" opacity="0.9"/>
  <text x="60" y="50" font-family="Georgia, serif" font-size="24" fill="#ffffff">
    <tspan fill="#c9a962">Can</tspan> Quetglas
  </text>

  <!-- Navigation -->
  <text x="450" y="47" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="2">EL HOTEL</text>
  <text x="580" y="47" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="2">HABITACIONES</text>
  <text x="730" y="47" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="2">POOL BAR</text>
  <text x="860" y="47" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="2">GALERÍA</text>
  <text x="970" y="47" font-family="Arial, sans-serif" font-size="12" fill="#888888" letter-spacing="2">CONTACTO</text>

  <!-- Book Button -->
  <rect x="1080" y="25" width="100" height="35" fill="none" stroke="#c9a962" stroke-width="1"/>
  <text x="1105" y="48" font-family="Arial, sans-serif" font-size="11" fill="#c9a962" letter-spacing="1">RESERVAR</text>

  <!-- Hero Section -->
  <rect x="0" y="80" width="1200" height="500" fill="#2a2a2a"/>

  <!-- Hero Image Placeholder -->
  <rect x="0" y="80" width="1200" height="500" fill="#1a1a1a" opacity="0.7"/>

  <!-- Hero Content -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="11" fill="#c9a962" text-anchor="middle" letter-spacing="4">BOUTIQUE HOTEL EN PALMA DE MALLORCA</text>

  <text x="600" y="360" font-family="Georgia, serif" font-size="72" fill="#ffffff" text-anchor="middle">Hotel Can Quetglas</text>

  <text x="600" y="420" font-family="Georgia, serif" font-size="22" fill="#e5e5e5" text-anchor="middle" font-style="italic">Your home away from home in Palma de Mallorca</text>

  <!-- CTA Buttons -->
  <rect x="440" y="460" width="150" height="45" fill="#c9a962"/>
  <text x="515" y="488" font-family="Arial, sans-serif" font-size="11" fill="#0a0a0a" text-anchor="middle" letter-spacing="1">RESERVAR</text>

  <rect x="610" y="460" width="150" height="45" fill="none" stroke="#ffffff" stroke-width="1"/>
  <text x="685" y="488" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1">DESCUBRIR</text>

  <!-- Scroll Indicator -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="9" fill="#888888" text-anchor="middle" letter-spacing="2">SCROLL</text>
  <line x1="600" y1="550" x2="600" y2="575" stroke="#c9a962" stroke-width="1"/>

  <!-- Section Below -->
  <rect x="0" y="580" width="1200" height="320" fill="#0a0a0a"/>

  <!-- Intro Section -->
  <text x="600" y="640" font-family="Arial, sans-serif" font-size="11" fill="#c9a962" text-anchor="middle" letter-spacing="3">BIENVENIDOS</text>

  <text x="600" y="700" font-family="Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle" font-style="italic">"Un palacete modernista de 1908, diseñado por un discípulo de Gaudí"</text>

  <!-- Divider -->
  <line x1="570" y1="730" x2="630" y2="730" stroke="#c9a962" stroke-width="1"/>

  <text x="600" y="770" font-family="Arial, sans-serif" font-size="14" fill="#888888" text-anchor="middle">Descubra nuestras 9 habitaciones únicas en el corazón del bohemio barrio de El Terreno</text>

  <!-- CTA -->
  <rect x="500" y="800" width="200" height="45" fill="none" stroke="#c9a962" stroke-width="1"/>
  <text x="600" y="828" font-family="Arial, sans-serif" font-size="11" fill="#c9a962" text-anchor="middle" letter-spacing="1">NUESTRA HISTORIA</text>

</svg>
